name: Tests d’intégration SunuRéservation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgresql]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sunureservation
          POSTGRES_USER: sunureservation
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sunureservation -d sunureservation"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025

    env:
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: ci-only-test-key-never-use-in-production-0123456789-abcdefghijklmnopqrstuvwxyz
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DB_ENGINE: ${{ matrix.database }}
      DB_NAME: ${{ matrix.database == 'postgresql' && 'sunureservation' || ':memory:' }}
      DB_USER: sunureservation
      DB_PASSWORD: ci-only-password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      EMAIL_HOST: 127.0.0.1
      EMAIL_PORT: "1025"
      EMAIL_USE_TLS: "False"
      EMAIL_USE_SSL: "False"
      DEFAULT_FROM_EMAIL: ci@sunureservation.invalid
      RUN_SMTP_INTEGRATION: "1"

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt

      - name: Attendre Mailpit
        run: |
          python - <<'PY'
          import socket
          import time

          for attempt in range(60):
              try:
                  with socket.create_connection(("127.0.0.1", 1025), timeout=1):
                      print("Mailpit est prêt")
                      break
              except OSError:
                  if attempt == 59:
                      raise
                  time.sleep(1)
          PY

      - name: Vérifier les migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Appliquer les migrations
        run: python manage.py migrate --noinput

      - name: Vérifications Django
        run: python manage.py check

      - name: Tests de parcours, de règles métier et SMTP
        run: python manage.py test -v 2

      - name: Contrôle de configuration de production
        run: |
          DJANGO_DEBUG=False \
          DJANGO_SECRET_KEY="$(python -c 'from django.core.management.utils import get_random_secret_key; print(get_random_secret_key())')" \
          DJANGO_ALLOWED_HOSTS=example.test \
          DJANGO_CSRF_TRUSTED_ORIGINS=https://example.test \
          DJANGO_SECURE_SSL_REDIRECT=True \
          DJANGO_SECURE_HSTS_SECONDS=31536000 \
          DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS=True \
          DJANGO_SECURE_HSTS_PRELOAD=True \
          python manage.py check --deploy
